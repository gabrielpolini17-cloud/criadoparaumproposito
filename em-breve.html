padding:0;

body{

align-items:center;
justify-content:center;

font-family:Inter,sans-serif;

color:#2F3A2F;

}


.container{

background:white;

max-width:500px;

width:90%;

padding:50px 35px;

text-align:center;

border-radius:25px;

}

font-size:18px;

}
