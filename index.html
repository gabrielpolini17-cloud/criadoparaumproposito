<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma Vida com Propósitos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Inter,sans-serif;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

color:white;

text-align:center;

padding:25px;

}

.card{

max-width:700px;

animation:fade .8s;

}

h1{

font-family:"Playfair Display";

font-size:60px;

margin-bottom:20px;

}

p{

font-size:22px;

line-height:1.7;

opacity:.95;

margin-bottom:40px;

}

a{

display:inline-block;

padding:18px 42px;

background:#4F6F52;

color:white;

text-decoration:none;

border-radius:40px;

font-size:18px;
font-weight:600;

transition:.3s;

}

a:hover{

transform:translateY(-3px);

background:#5f8762;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:700px){

h1{

font-size:42px;

}

p{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="card">

<h1>🌿 Uma Vida com Propósitos</h1>

<p>

Uma jornada de 40 dias para conhecer melhor a Deus, descobrir seu propósito e fortalecer sua caminhada com Cristo.

</p>

<a href="home.html">

Começar Jornada →

</a>

</div>

</body>

</html>
